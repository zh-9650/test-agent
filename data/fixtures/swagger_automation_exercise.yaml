openapi: 3.0.3
info:
  title: Automation Exercise API
  version: 1.0.0
  description: |
    Automation Exercise 公开 REST API 文档
    来源: https://automationexercise.com/api_list
    用于 Node 1 (KnowledgeBase) 提取 API 路径、参数与响应码约束。
servers:
  - url: https://automationexercise.com
    description: Production (公开测试站)
  - url: http://automationexercise.com
    description: HTTP mirror

paths:
  /api/productsList:
    get:
      summary: API 1 — Get All Products List
      description: 无认证要求; 返回所有产品 JSON 数组。
      responses:
        '200':
          description: 200, products list
        '405':
          description: POST/PUT/DELETE 不被支持
  /api/brandsList:
    get:
      summary: API 3 — Get All Brands List
      description: 无认证要求; 返回品牌列表 (Polo / H&M / Madame / ...)。
      responses:
        '200':
          description: 200, brands list
  /api/searchProduct:
    post:
      summary: API 5/6 — Search Product
      description: |
        POST body form-data: search_product
        200 命中; 400 缺 search_product 参数。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [search_product]
              properties:
                search_product:
                  type: string
                  example: "top"
      responses:
        '200':
          description: 200, searched products list
        '400':
          description: Bad request, search_product parameter is missing
  /api/verifyLogin:
    post:
      summary: API 7/8/10 — Verify Login
      description: |
        POST body form-data: email, password
        200 — User exists!
        400 — email or password parameter is missing
        404 — User not found!
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, example: "test_c@example.com" }
                password: { type: string, example: "Pass@123" }
      responses:
        '200': { description: "User exists!" }
        '400': { description: "Bad request, email or password parameter is missing" }
        '404': { description: "User not found!" }
    delete:
      summary: API 9 — DELETE on /verifyLogin
      description: 405, This request method is not supported.
      responses:
        '405': { description: "This request method is not supported." }
  /api/createAccount:
    post:
      summary: API 11 — Create/Register User Account
      description: |
        POST body form-data: 17 个字段
        201 — User created!
        400 — 缺字段
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - title
                - birth_date
                - birth_month
                - birth_year
                - firstname
                - lastname
                - company
                - address1
                - country
                - zipcode
                - state
                - city
                - mobile_number
              properties:
                name:         { type: string, example: "Test User" }
                email:        { type: string, example: "test_user_unique@example.com" }
                password:     { type: string, example: "Pass@1234" }
                title:        { type: string, enum: [Mr, Mrs, Miss], example: "Mr" }
                birth_date:   { type: string, example: "1" }
                birth_month:  { type: string, example: "1" }
                birth_year:   { type: string, example: "1990" }
                firstname:    { type: string, example: "Test" }
                lastname:     { type: string, example: "User" }
                company:      { type: string, example: "ACME" }
                address1:     { type: string, example: "123 Test Street" }
                address2:     { type: string, example: "" }
                country:      { type: string, example: "India" }
                zipcode:      { type: string, example: "110001" }
                state:        { type: string, example: "Delhi" }
                city:         { type: string, example: "Delhi" }
                mobile_number:{ type: string, example: "9876543210" }
      responses:
        '201': { description: "User created!" }
        '400': { description: "Bad request" }
  /api/updateAccount:
    put:
      summary: API 13 — Update User Account
      description: |
        PUT body form-data: 与 createAccount 同 17 字段, 但 email 用于定位记录
        200 — User updated!
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string }
                password: { type: string }
      responses:
        '200': { description: "User updated!" }
        '400': { description: "Bad request" }
  /api/deleteAccount:
    delete:
      summary: API 12 — Delete User Account
      description: |
        DELETE body form-data: email, password
        200 — Account deleted!
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string }
                password: { type: string }
      responses:
        '200': { description: "Account deleted!" }
        '400': { description: "Bad request" }
  /api/getUserDetailByEmail:
    get:
      summary: API 14 — GET user account detail by email
      description: |
        Query: email
        200 — User Detail JSON
        400 — missing email
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: "User Detail" }
        '400': { description: "Bad request, email parameter is missing" }
